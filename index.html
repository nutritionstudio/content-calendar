<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Calendar Ideas</title>
<style>
:root{--olive:#4A5A48;--olive-d:#364334;--clay:#B8734F;--bg:#F6F3EC;--card:#fff;--line:#DDD7C8;--fg:#2B2F2A;--mute:#6C7168;--chip:#EDE8DB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--olive);color:#fff;padding:26px 16px 22px}
.brand{display:block;height:48px;width:auto;max-width:100%;margin:0 0 18px}
header .wrap{display:flex;flex-direction:column;align-items:flex-start}
.wrap{max-width:980px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:-.01em}
header p{margin:0;opacity:.85}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);min-width:72px}
input[type=search],select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
input[type=search]{flex:1;min-width:200px}
.chip{font:inherit;font-size:.88rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:#fff}
.chip.o[aria-pressed=true]{background:var(--clay);border-color:var(--clay)}
.chk{display:flex;gap:6px;align-items:center;font-size:.9rem}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--mute);padding:14px 0 6px}
.meta button{font:inherit;background:none;border:0;color:var(--clay);cursor:pointer;text-decoration:underline;padding:0}
main{padding:0 16px 60px}
h2{font-size:1rem;margin:22px 0 8px;color:var(--olive);border-bottom:2px solid var(--clay);padding-bottom:4px;display:flex;justify-content:space-between}
h2 span{font-weight:400;color:var(--mute);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.card.used{background:#EEF0EA;opacity:.75}
.card p{margin:0 0 10px;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--olive-d)}
.tag.o{background:#F2E1D6;color:#7A4528}
.sp{flex:1}
.act{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:8px;border:1px solid var(--olive);background:#fff;color:var(--olive);cursor:pointer}
.act.on{background:var(--olive);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
</style></head><body>

const D=[{"id": "1-1", "w": 1, "t": "Start the week with one small habit, not a full overhaul. Post a \"this week's one thing\" card, like adding protein to breakfast, with 3 easy ways to do it (eggs, Greek yogurt, tofu scramble).", "f": ["Feed post"], "o": ["Educate"]}, {"id": "1-2", "w": 1, "t": "It's time for VALUE-PACKED CONTENT! Carousel: read a nutrition label in 5 steps (serving size, added sugars, fiber, sodium, ingredients). Demo it with a real label in Stories.", "f": ["Carousel", "Stories"], "o": ["Educate"]}, {"id": "1-3", "w": 1, "t": "Share your \"why\" today! Post a photo and share what led you to nutrition or coaching, plus one lesson from your work that changed how you practice.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "1-4", "w": 1, "t": "Social proof Thursday. Share a client testimonial (with written permission) about their experience, like feeling supported, not about results. Add a soft offer for your program. Use a CTA like: book a free discovery call, or DM me \"START.\"", "f": ["Feed post"], "o": ["Social proof", "Soft sell"]}, {"id": "1-5", "w": 1, "t": "Friday fun! Share a relatable food meme, like \"meal prep plans vs. what I actually ate Wednesday,\" and ask which one your audience is today.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "1-6", "w": 1, "t": "To keep people engaging, make a THIS vs. THAT post comparing two real swaps, like Greek yogurt vs. regular yogurt, with one line on how they differ in protein. Ask which one they pick.", "f": ["Feed post"], "o": ["Educate", "Engage"]}, {"id": "1-7", "w": 1, "t": "Show your Sunday reset in Stories: your grocery run or meal prep, and why each item is in your cart. Ask your audience what they always keep stocked in their kitchen.", "f": ["Stories"], "o": ["Behind the scenes", "Engage"]}, {"id": "2-1", "w": 2, "t": "Motivation Monday: post a weekly reset checklist: plan 3 dinners, prep 1 protein, stock 2 snacks, schedule movement.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "2-2", "w": 2, "t": "Reel: act out a nutrition myth you hear daily (\"no carbs after 6pm\"), then bust it with one clear fact.", "f": ["Reels"], "o": ["Educate"]}, {"id": "2-3", "w": 2, "t": "Carousel in 3 steps: build a grocery list by category (protein, produce, pantry) with a real example.", "f": ["Carousel"], "o": ["Educate"]}, {"id": "2-4", "w": 2, "t": "Show what's inside your program in a Reel: a screen recording of your meal planner or food journal.", "f": ["Reels"], "o": ["Soft sell"]}, {"id": "2-5", "w": 2, "t": "Counterintuitive post: FORGET EVERYTHING YOU KNOW ABOUT \"CLEAN\" EATING. Explain that no single food is \"good\" or \"bad,\" and show what a flexible, balanced plate looks like.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "2-6", "w": 2, "t": "Post a quote on consistency over perfection. In the caption, share how you coach clients through off days (\"your next meal is a fresh start\"). Ask: \"What's your go-to reset after a rough day?\"", "f": ["Feed post"], "o": ["Engage", "Educate"]}, {"id": "2-7", "w": 2, "t": "Post a selfie with 3 fun facts: your go-to snack, a food you used to avoid, and what you're learning right now.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "3-1", "w": 3, "t": "Start the week light and relatable. Post a \"how I feel when...\" meme about Monday meal prep or a vending-machine lunch.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "3-2", "w": 3, "t": "Spot the common mistake. Title it \"Why you're hungry again by 3pm...\" Ex: low-protein breakfast, skipped lunch, not enough fiber. In the caption, explain the habit and one simple fix, and note that needs vary by person.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "3-3", "w": 3, "t": "Carousel: batch cook for the week in about 90 minutes (2 proteins, 2 grains, 3 veggies) with a simple timeline.", "f": ["Carousel"], "o": ["Educate"]}, {"id": "3-4", "w": 3, "t": "Bust some myths with a post with 5 protein myths, like \"more is always better\" and \"plant protein is incomplete,\" each with a one-line correction.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "3-5", "w": 3, "t": "Share a client's words (with written permission) in a FEEDBACK post about feeling supported, not about numbers.", "f": ["Feed post"], "o": ["Social proof"]}, {"id": "3-6", "w": 3, "t": "Share your approach. Post your coaching philosophy! Explain how you work with clients: personalized plans, small steps, and no one-size-fits-all diets.", "f": ["Feed post"], "o": ["Soft sell", "Behind the scenes"]}, {"id": "3-7", "w": 3, "t": "Create an ON vs. OFF switch post with eating habits, like phone OFF at the table and mindful bites ON.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "4-1", "w": 4, "t": "What are you reading? Share a book or study on nutrition or behavior change you're reading, plus one takeaway you use with clients. Ask what they're reading or what topic you should cover next.", "f": ["Feed post", "Stories"], "o": ["Engage", "Behind the scenes"]}, {"id": "4-2", "w": 4, "t": "Run a series of 3 polls in the morning, like \"Do you eat breakfast?\" and \"Do you track protein?\" Then open a Q&A box on \"What confuses you about nutrition?\" and answer throughout the day.", "f": ["Stories"], "o": ["Engage"]}, {"id": "4-3", "w": 4, "t": "Post a 60-90 second video that teaches one skill, like ordering a balanced meal at a restaurant or building a protein-rich snack.", "f": ["Reels"], "o": ["Educate"]}, {"id": "4-4", "w": 4, "t": "#TBT time. Share a throwback: your first meal-prep photo, your first workshop, or a nutrition belief you changed your mind about, and what shifted.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "4-5", "w": 4, "t": "Today's post will ease food guilt and offer a way forward. Title: \"IT DOESN'T MATTER IF...\". Name a common food-guilt moment and give a practical next step. Ex: It doesn't matter if you skipped breakfast, build a balanced lunch // It doesn't matter if dinner was late, your next meal is a fresh start.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "4-6", "w": 4, "t": "Make a Reel answering a common question from your Q&A box like \"Is it OK to eat late at night?\" or \"Do I need to cut out sugar?\" Answer in 30 seconds.", "f": ["Reels"], "o": ["Educate"]}, {"id": "4-7", "w": 4, "t": "Share your 5-step Sunday meal-prep routine: plan, shop, wash and chop, cook a protein and a grain, portion. Show your containers in a Reel or Story.", "f": ["Reels", "Stories"], "o": ["Educate"]}, {"id": "5-1", "w": 5, "t": "Motivation Monday. Make a post styled like a text post on X or Threads with a thought that reframes a food rule, like \"Food is fuel, not a reward or punishment.\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "5-2", "w": 5, "t": "Did you know? Share a surprising fact, like \"Fiber comes in two types, soluble and insoluble, and they work differently.\" Ask if they knew it.", "f": ["Feed post"], "o": ["Educate", "Engage"]}, {"id": "5-3", "w": 5, "t": "Two truths and a lie. Share two truths and one lie about your food habits or your work (like \"I eat dessert most days\") and let your audience guess. Reveal the answer in the caption.", "f": ["Feed post"], "o": ["Engage", "Behind the scenes"]}, {"id": "5-4", "w": 5, "t": "Uncover 5 things about food labels most people miss: \"no sugar added\" vs. \"sugar-free,\" serving sizes, and what \"natural\" does and doesn't mean. Make it a carousel.", "f": ["Carousel"], "o": ["Educate"]}, {"id": "5-5", "w": 5, "t": "Post a series of 7 Stories in poll format about weekend eating, like \"Meal prep?\", \"Brunch or dinner out?\" and \"Sweet or savory?\" Use the answers to plan next week's content.", "f": ["Stories"], "o": ["Engage"]}, {"id": "5-6", "w": 5, "t": "Tie a trending topic to nutrition. Ex: Trending: a viral \"what I eat in a day\" video. Post: what works, what's missing, and how to adapt it (never shame creators).", "f": ["Feed post"], "o": ["Educate"]}, {"id": "5-7", "w": 5, "t": "Show your morning routine, including your breakfast and what's in your cup. Ask your audience for their go-to breakfast in a Stories question box, and reshare a few.", "f": ["Stories"], "o": ["Behind the scenes", "Engage"]}, {"id": "6-1", "w": 6, "t": "Show a little more of your workspace and the one tool you use most with clients, like a food journal or meal planner. Explain how you use it.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "6-2", "w": 6, "t": "Create a bingo-style post with common eating moments: skipping breakfast, snacking at your desk, \"I'll start Monday.\" Ask people to share their score.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "6-3", "w": 6, "t": "Make a Reel with a simple tutorial on a high-protein snack in 2 minutes, like cottage cheese with berries and chia. Show quantities on screen.", "f": ["Reels"], "o": ["Educate"]}, {"id": "6-4", "w": 6, "t": "Make a post styled like a text message conversation with a real client question (anonymized), like \"Is fruit OK if I'm watching my sugar?\" Answer in your caption.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "6-5", "w": 6, "t": "TGIF! Give 3 tips to enjoy the weekend without food stress: regular meals, hydration, and one meal you're excited about.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "6-6", "w": 6, "t": "Post a client testimonial (with written permission) about their experience with your program, like feeling more confident planning meals.", "f": ["Feed post"], "o": ["Social proof", "Soft sell"]}, {"id": "6-7", "w": 6, "t": "Entertain your audience with a funny Reel about a relatable food moment, like staring into the fridge at 9pm.", "f": ["Reels"], "o": ["Engage"]}, {"id": "7-1", "w": 7, "t": "Swap This >>> For That. Show 3 swaps with a reason for each: juice to whole fruit (more fiber), flavored yogurt to plain Greek yogurt with fruit (less added sugar).", "f": ["Feed post"], "o": ["Educate"]}, {"id": "7-2", "w": 7, "t": "Share 5 ways to add more fiber to your day in a Reel: chia, beans, berries, oats, and veggies, with on-screen text.", "f": ["Reels"], "o": ["Educate"]}, {"id": "7-3", "w": 7, "t": "Make a Q&A-style post on \"Do I need a supplement?\" Answer in a carousel: food first, who may benefit, and why to check with a doctor.", "f": ["Carousel"], "o": ["Educate"]}, {"id": "7-4", "w": 7, "t": "Create a quiz in your Stories on protein sources first thing in the morning. Later in the day, give a 'mini lesson' on that same topic in your Stories. Save it to your Highlights or turn it into a Reel so it stays up and helps anyone who lands on your profile.", "f": ["Stories", "Reels"], "o": ["Educate", "Engage"]}, {"id": "7-5", "w": 7, "t": "Introduce yourself again. Post a photo with your credentials, who you help, and how you work. Sum up what people can expect from your page: topics, formats, and how to work with you.", "f": ["Feed post"], "o": ["Soft sell", "Behind the scenes"]}, {"id": "7-6", "w": 7, "t": "Show behind the scenes of your weekend, your family, a weekend meal you enjoyed, what you're up to offline. Also, open a Q&A box titled ANYTHING BUT WORK, to build a closer connection with your audience.", "f": ["Stories"], "o": ["Behind the scenes", "Engage"]}, {"id": "7-7", "w": 7, "t": "Make an expectation vs. reality Reel. Meal prep Sunday: the perfectly portioned containers you planned vs. the real kitchen mess.", "f": ["Reels"], "o": ["Engage"]}, {"id": "8-1", "w": 8, "t": "Start the week with an easy, actionable tip, like 5 steps to... (build a balanced plate / read a food label / plan a week of dinners / stock a healthy pantry)", "f": ["Feed post"], "o": ["Educate"]}, {"id": "8-2", "w": 8, "t": "Enough! Share your take on something you're tired of seeing in nutrition, like all-or-nothing food rules. Great for strengthening your positioning.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "8-3", "w": 8, "t": "Open a Q&A box with an open topic and note which questions come up most.", "f": ["Stories"], "o": ["Engage"]}, {"id": "8-4", "w": 8, "t": "Create a post on the most common question from yesterday's Q&A box. Put the title in quotes, like \"Can I eat carbs at night?\", to show it's a real question, and answer with evidence-based nuance.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "8-5", "w": 8, "t": "Share an expectation vs. reality meme about grocery shopping or meal prep: the picture-perfect fridge vs. the real one.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "8-6", "w": 8, "t": "Open a TRUE or FALSE question box on food claims, like \"Eggs raise your cholesterol,\" and reply True, False, or It depends, with a one-line reason.", "f": ["Stories"], "o": ["Engage", "Educate"]}, {"id": "8-7", "w": 8, "t": "Sunday is when many people are most active online, so share your story again. Make a short video about how you got into nutrition or coaching and who you love working with.", "f": ["Reels"], "o": ["Behind the scenes", "Soft sell"]}, {"id": "9-1", "w": 9, "t": "Post a quote from a book that inspires your work, and add how you apply it with clients.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "9-2", "w": 9, "t": "Make a post on the 5 types of people in your field. Ex: 5 types of grocery shoppers / 5 types of snackers / 5 types of meal preppers. Keep the tone light and kind.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "9-3", "w": 9, "t": "Teach your audience something with the classic \"HOW TO...\" post. Try a format you use less, like a Reel or a carousel. Ex: how to build a high-fiber breakfast.", "f": ["Reels", "Carousel"], "o": ["Educate"]}, {"id": "9-4", "w": 9, "t": "A checklist to get from point A to point B. Ex: from \"I eat whatever's around\" to a weekly plan: plan, shop, prep, portion.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "9-5", "w": 9, "t": "Say what everyone in nutrition thinks but nobody says, like \"You don't need a perfect plate to have a good diet.\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "9-6", "w": 9, "t": "Show your Saturday routine in a light way: farmers market, a walk, brunch. Add polls to chat with your audience, like \"Sweet or savory brunch?\"", "f": ["Stories"], "o": ["Behind the scenes", "Engage"]}, {"id": "9-7", "w": 9, "t": "That's why... you crash at 3pm / you snack all evening / dinner always runs late. Post common habit mistakes with one simple fix each.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "10-1", "w": 10, "t": "Start the week with a Stories sequence on one small, realistic goal. Then open a Q&A box asking your followers to share something with you. Ex. A Stories sequence on weekly nutrition goals (like \"add one vegetable to dinner\") + a box for followers to share theirs.", "f": ["Stories"], "o": ["Engage"]}, {"id": "10-2", "w": 10, "t": "Make a carousel with 10 reasons to do something (like 10 reasons to eat more fiber, or to work with a nutrition professional).", "f": ["Carousel"], "o": ["Educate", "Soft sell"]}, {"id": "10-3", "w": 10, "t": "How about sharing a screenshot of a testimonial today? Get written permission first.", "f": ["Feed post"], "o": ["Social proof"]}, {"id": "10-4", "w": 10, "t": "#TBTWIN Use Throwback Thursday to share a professional win, like your first client workshop or a new certification. A great chance to write a longer caption and inspire your audience.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "10-5", "w": 10, "t": "Make a Stories sequence about a food or health documentary you watched: what it gets right, what it misses, and whether you'd recommend it for the weekend.", "f": ["Stories"], "o": ["Educate"]}, {"id": "10-6", "w": 10, "t": "Answer a very common question from your audience in a Reel, like \"Do I need to eat every 3 hours?\"", "f": ["Reels"], "o": ["Educate"]}, {"id": "10-7", "w": 10, "t": "Post a Sunday-night checklist for the week ahead (water bottle, lunches, snacks, groceries) and ask your audience what they'd add.", "f": ["Feed post"], "o": ["Educate", "Engage"]}, {"id": "11-1", "w": 11, "t": "Make a Stories sequence connecting the start of your week to your goals. Invite your audience to share theirs, like one habit they want to build this month.", "f": ["Stories"], "o": ["Engage"]}, {"id": "11-2", "w": 11, "t": "Create counterintuitive content. That is, it goes against what most people believe. Ex: \"Breakfast isn't mandatory for everyone.\" Explain when it may fit and when it doesn't.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "11-3", "w": 11, "t": "Make a Reel that ties a trending audio to a food tip, like a quick swap or a 15-second grocery hack.", "f": ["Reels"], "o": ["Educate"]}, {"id": "11-4", "w": 11, "t": "#TBTLESSONLEARNED Share a setback from your career, like a client plan that didn't work, and what you learned (no identifying details). The goal is to build connection and turn a hard moment into a lesson.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "11-5", "w": 11, "t": "Make a Top 10 list for your niche: top 10 high-fiber foods, top 10 plant-based protein sources, top 10 pantry staples, top 10 books on nutrition...", "f": ["Feed post", "Carousel"], "o": ["Educate"]}, {"id": "11-6", "w": 11, "t": "Show more of your personal life and hobbies. What are you up to this weekend, and how do you recharge?", "f": ["Stories", "Feed post"], "o": ["Behind the scenes"]}, {"id": "11-7", "w": 11, "t": "Who or what inspires you? Make a Stories sequence and a feed post sharing your sources of inspiration: mentors, books, or researchers you follow.", "f": ["Stories", "Feed post"], "o": ["Behind the scenes"]}, {"id": "12-1", "w": 12, "t": "Share a quote that fits your practice and, of course, your take on it!", "f": ["Feed post"], "o": ["Educate"]}, {"id": "12-2", "w": 12, "t": "Make a Stories sequence on your brand's NON-NEGOTIABLE VALUES. Save it to your Highlights! Ex: evidence-based advice, no shame, no one-size-fits-all plans.", "f": ["Stories"], "o": ["Soft sell", "Behind the scenes"]}, {"id": "12-3", "w": 12, "t": "Make a Reel showing different ways to use your product, like your meal planner, food journal, or grocery guide.", "f": ["Reels"], "o": ["Soft sell"]}, {"id": "12-4", "w": 12, "t": "Make a post titled: THE BEST ADVICE YOU'LL GET TODAY. Answer something your audience NEEDS help with, like \"How do I start meal planning?\", and give clear first steps.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "12-5", "w": 12, "t": "Make a SWAP THIS FOR THAT post with mindsets your audience has vs. mindsets that serve them. Ex: \"I'm being bad\" to \"I'm choosing what works for me today.\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "12-6", "w": 12, "t": "Make a before-and-after Reel about habits or mindset, not bodies: a fridge before and after a restock, or a grocery list before and after a plan.", "f": ["Reels"], "o": ["Educate"]}, {"id": "12-7", "w": 12, "t": "Post a funny meme about the feeling of the week ahead, like Sunday-night meal prep vs. Monday-morning reality.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "13-1", "w": 13, "t": "Record a short video sharing a surprising moment from your story that shaped your growth as a nutrition professional.", "f": ["Reels"], "o": ["Behind the scenes"]}, {"id": "13-2", "w": 13, "t": "Be useful! Make a practical checklist, like \"5 things to check before buying packaged snacks.\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "13-3", "w": 13, "t": "Make a post titled: what you see vs. what you don't see. Show the rewarding parts and the unseen work of your practice, like client notes, continuing education, and research time.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "13-4", "w": 13, "t": "Grab your followers' attention with a post \"3 THINGS NOBODY TELLS YOU ABOUT...\" with 3 lesser-known facts, like why frozen vegetables can be as nutritious as fresh.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "13-5", "w": 13, "t": "Share a few client testimonials as images (screenshots or a designed post), with written permission and no health results. Add a CTA inviting people to book a discovery call.", "f": ["Feed post"], "o": ["Social proof", "Soft sell"]}, {"id": "13-6", "w": 13, "t": "Make a reminder-style post to set a positive tone for the week, like \"Plan one meal you're looking forward to.\"", "f": ["Feed post"], "o": ["Engage"]}, {"id": "13-7", "w": 13, "t": "How about telling your story a different way? Share 5 facts about you or your practice, plus one fib. Challenge your followers to spot the fake one.", "f": ["Feed post"], "o": ["Engage", "Behind the scenes"]}, {"id": "14-1", "w": 14, "t": "Make a REEL with a tutorial in a few steps that solves a common problem for your audience, like how to cook eggs three ways or build a snack plate.", "f": ["Reels"], "o": ["Educate"]}, {"id": "14-2", "w": 14, "t": "Create a post that looks like a chat between you and a follower, with an insight that inspires, like \"Can I still enjoy dessert?\" \"Yes, it can fit into a balanced pattern.\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "14-3", "w": 14, "t": "#TBTsetback Look back on a hard situation you faced in your career and share the positive lessons you took from it, to inspire your audience.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "14-4", "w": 14, "t": "Your post title should be: 3 reasons to... (try your program, book a consult, download your guide...)", "f": ["Feed post"], "o": ["Soft sell"]}, {"id": "14-5", "w": 14, "t": "Show a bit more of your Saturday routine in Stories and open a Q&A box asking for weekend outing ideas, like a favorite farmers market, trail, or café with great healthy options.", "f": ["Stories"], "o": ["Behind the scenes", "Engage"]}, {"id": "14-6", "w": 14, "t": "Pattern break: film Stories outdoors, away from your usual setting, and share a positive reflection, like \"Movement can be a walk, not just a workout.\"", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "14-7", "w": 14, "t": "Make a counterintuitive post with a title nobody expects and your stance on the topic, like \"Why I don't use the term 'cheat day.'\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "15-1", "w": 15, "t": "Make a post about 3 people in your field who inspire you. Encourage your followers to tag the 3 people who inspire them most.", "f": ["Feed post"], "o": ["Engage", "Behind the scenes"]}, {"id": "15-2", "w": 15, "t": "Talk in your Stories about a work tool you can't do without, like a food scale, a nutrition database, or a client tracking app.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "15-3", "w": 15, "t": "Show something you bought recently in Stories that your audience can connect with, like a new kitchen gadget or a farmers market find.", "f": ["Stories"], "o": ["Behind the scenes", "Engage"]}, {"id": "15-4", "w": 15, "t": "Lifestyle moment. Post a photo at a restaurant or a spot your audience will love, and share what you look for on the menu.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "15-5", "w": 15, "t": "Favorite habit hack!", "f": ["Feed post", "Stories"], "o": ["Educate"]}, {"id": "15-6", "w": 15, "t": "Encourage your audience to watch a movie that changed your life, and share why it stayed with you.", "f": ["Stories", "Feed post"], "o": ["Behind the scenes"]}, {"id": "15-7", "w": 15, "t": "Tell the story behind your business name.", "f": ["Stories", "Feed post"], "o": ["Behind the scenes"]}, {"id": "16-1", "w": 16, "t": "Motivation to step out of your comfort zone! Try a format you've been avoiding, like a voiceover Reel or a carousel.", "f": ["Reels", "Carousel"], "o": ["Educate"]}, {"id": "16-2", "w": 16, "t": "Ask your audience a question about nutrition, like their biggest challenge with meal planning or their opinion on a food trend.", "f": ["Stories", "Feed post"], "o": ["Engage"]}, {"id": "16-3", "w": 16, "t": "#TBT Tell the story of an unforgettable moment in your career, like your first client or first workshop.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "16-4", "w": 16, "t": "Engagement moment: Use a question box to ask something your followers can't resist answering, like \"Sweet or savory breakfast?\" or \"What's your go-to snack?\"", "f": ["Stories"], "o": ["Engage"]}, {"id": "16-5", "w": 16, "t": "Storytelling: share your routine in a continuous, engaging way, from morning coffee to dinner prep, so your audience stays curious about what comes next.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "16-6", "w": 16, "t": "Share something new you learned this week, like a study, a podcast episode, or a client lesson (no identifying details)!", "f": ["Stories", "Feed post"], "o": ["Educate"]}, {"id": "16-7", "w": 16, "t": "Expert moment: Share a new, relevant piece of nutrition news, like a recent study or guideline update, and explain what it means in plain language (cite the source).", "f": ["Feed post"], "o": ["Educate"]}, {"id": "17-1", "w": 17, "t": "Movement: share a fitness moment with your audience, like a walk, a strength session, or a stretch break, and tie it to energy and consistency.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "17-2", "w": 17, "t": "Make a Stories session on how you plan your week, from your meal plan and grocery list to time for movement and rest.", "f": ["Stories"], "o": ["Behind the scenes", "Educate"]}, {"id": "17-3", "w": 17, "t": "Share a photo of a client using your tool or program, like a food journal or meal planner, with written permission and no health details.", "f": ["Feed post"], "o": ["Social proof"]}, {"id": "17-4", "w": 17, "t": "Ask your audience which topics they'd like to see next week, like gut health, meal prep, or label reading.", "f": ["Stories"], "o": ["Engage"]}, {"id": "17-5", "w": 17, "t": "Make a post about the top trends in nutrition right now, and what the evidence says.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "17-6", "w": 17, "t": "Make a Stories session on how you relax and unplug, like a wind-down routine, a favorite tea, or a screen-free hour.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "17-7", "w": 17, "t": "Share what you're reading with your audience. Make a post highlighting the biggest insights, and tie one to something your clients can apply.", "f": ["Feed post"], "o": ["Educate", "Behind the scenes"]}, {"id": "18-1", "w": 18, "t": "Reveal in your Stories a habit you want to build but keep putting off, like drinking more water or stretching daily. Invite your audience to share the habits they want to build too.", "f": ["Stories"], "o": ["Engage", "Behind the scenes"]}, {"id": "18-2", "w": 18, "t": "Explain how your product or service works, step by step, and add a Call to Action (CTA) inviting followers to learn more or book a call.", "f": ["Feed post"], "o": ["Soft sell"]}, {"id": "18-3", "w": 18, "t": "Share a recent moment that stayed with you, and what it taught you.", "f": ["Feed post", "Stories"], "o": ["Behind the scenes"]}, {"id": "18-4", "w": 18, "t": "Tell a bit more of your personal story. Share it in Stories and save it to your Highlights, or turn it into a Reel.", "f": ["Stories", "Reels"], "o": ["Behind the scenes"]}, {"id": "18-5", "w": 18, "t": "Make a post about something funny that only your followers get, like \"when the recipe says 'season to taste' and you have no idea.\" Do it as a Reel or a meme.", "f": ["Reels", "Feed post"], "o": ["Engage"]}, {"id": "18-6", "w": 18, "t": "A short video of your breakfast with soft music in the background, plus one line on why you chose it.", "f": ["Reels"], "o": ["Behind the scenes"]}, {"id": "18-7", "w": 18, "t": "Make a feed post that answers a common objection from potential clients, like \"I don't have time to meal prep\" or \"Nutrition counseling is too expensive.\"", "f": ["Feed post"], "o": ["Soft sell", "Educate"]}, {"id": "19-1", "w": 19, "t": "Recommend a product that makes your life easier, like meal prep containers or a kitchen scale, and explain how it helps. Disclose any affiliate link or gifted item.", "f": ["Feed post"], "o": ["Soft sell"]}, {"id": "19-2", "w": 19, "t": "Share your favorite playlist, like your cooking or walking mix, and ask followers for new song recommendations to spark interaction.", "f": ["Stories"], "o": ["Engage", "Behind the scenes"]}, {"id": "19-3", "w": 19, "t": "#TBTNOSTALGIA Share a throwback from your school days with a story about what you were like, maybe your school lunch. Invite followers to share what they remember eating back then.", "f": ["Feed post"], "o": ["Behind the scenes", "Engage"]}, {"id": "19-4", "w": 19, "t": "Social proof: Post a screenshot or video of a client sharing their experience with your service (with written permission, no health claims).", "f": ["Feed post", "Reels"], "o": ["Social proof"]}, {"id": "19-5", "w": 19, "t": "Recommend a YouTube video everyone in your niche should watch, like a talk on behavior change, and share your takeaway.", "f": ["Feed post", "Stories"], "o": ["Educate"]}, {"id": "19-6", "w": 19, "t": "Open a question box where you'll answer with: I HAVE or I HAVEN'T. That is, what you've done vs. what you haven't, like \"Tried meal prepping for a month?\"", "f": ["Stories"], "o": ["Engage"]}, {"id": "19-7", "w": 19, "t": "Make a feed post with the 7 best tips on one specific topic, like eating out or meal prep. Focus on making your follower's life easier with practical, specific tips instead of general advice.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "20-1", "w": 20, "t": "Invite a colleague in your field, like a trainer or therapist, and go live or record a short interview on a topic that solves a problem for your audience, such as stress and eating.", "f": ["Live", "Reels"], "o": ["Educate"]}, {"id": "20-2", "w": 20, "t": "Share what motivates you most about your work and who you love helping.", "f": ["Feed post", "Stories"], "o": ["Behind the scenes"]}, {"id": "20-3", "w": 20, "t": "Post a professional photo on your feed with a reflective caption about what you've learned from working with clients.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "20-4", "w": 20, "t": "Show behind the scenes of your work and talk about what you're looking forward to this weekend, like a favorite meal or an outing.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "20-5", "w": 20, "t": "Make a trend-based Reel with a popular sound or voiceover, adapted to nutrition.", "f": ["Reels"], "o": ["Engage"]}, {"id": "20-6", "w": 20, "t": "Share a food belief you used to hold and no longer do, like \"carbs are bad\" or \"I have to eat clean,\" and what changed your mind.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "20-7", "w": 20, "t": "Share a podcast or YouTube channel you watch often, like one on nutrition science or behavior change, and say why you recommend it.", "f": ["Feed post", "Stories"], "o": ["Educate"]}, {"id": "21-1", "w": 21, "t": "Run a poll sequence in Stories on a nutrition topic, like protein at breakfast, and tie it to a feed post where you go deeper on the same topic.", "f": ["Stories", "Feed post"], "o": ["Educate", "Engage"]}, {"id": "21-2", "w": 21, "t": "Share the top 5 reasons to work with you or try your program, based on how you actually help (no outcome promises).", "f": ["Feed post", "Carousel"], "o": ["Soft sell"]}, {"id": "21-3", "w": 21, "t": "Share what sets your approach apart, like personalized plans or a focus on behavior change.", "f": ["Feed post"], "o": ["Soft sell"]}, {"id": "21-4", "w": 21, "t": "Make a tutorial or checklist of the most important items on one topic, like what to keep in a healthy pantry.", "f": ["Feed post", "Carousel"], "o": ["Educate"]}, {"id": "21-5", "w": 21, "t": "Milestone moment: show a professional win, like a new certification or a full calendar, to inspire your followers.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "21-6", "w": 21, "t": "Draw the winner! Announce it in Stories and thank everyone who joined.", "f": ["Stories"], "o": ["Engage"]}, {"id": "21-7", "w": 21, "t": "Post a giveaway, drawn on Sunday, like a meal-planner template or a free consult. Set clear rules, state that no purchase is necessary, and follow Instagram's promotion guidelines.", "f": ["Feed post"], "o": ["Engage", "Soft sell"]}, {"id": "22-1", "w": 22, "t": "Post a photo with someone you love, like a partner, family member, or friend, with a reflection on gratitude, maybe around sharing a meal.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "22-2", "w": 22, "t": "Open a question box titled: How can I help you today?", "f": ["Stories"], "o": ["Engage", "Soft sell"]}, {"id": "22-3", "w": 22, "t": "TBT Post a photo from a trip and share the experience, like a local dish you tried. Invite followers to comment on their best trip or dream destination and the food they'd try there.", "f": ["Feed post"], "o": ["Behind the scenes", "Engage"]}, {"id": "22-4", "w": 22, "t": "Share 3 reasons you chose your niche or created your program.", "f": ["Feed post"], "o": ["Behind the scenes", "Soft sell"]}, {"id": "22-5", "w": 22, "t": "Motivational quote: Post a motivational quote that sparks reflection, about consistency or self-compassion with food.", "f": ["Feed post"], "o": ["Engage"]}, {"id": "22-6", "w": 22, "t": "Open a question box with an OPEN TOPIC. Let followers ask about your personal or professional life, and answer without giving individual medical advice.", "f": ["Stories"], "o": ["Engage"]}, {"id": "22-7", "w": 22, "t": "Video: Post a longer video walking through the details of your program or service, like what's included and how a first session works.", "f": ["Reels"], "o": ["Soft sell"]}, {"id": "23-1", "w": 23, "t": "Tell the story of a client who used your program (anonymous, with permission), focusing on the process, and add a soft offer.", "f": ["Feed post"], "o": ["Social proof", "Soft sell"]}, {"id": "23-2", "w": 23, "t": "Share how you find inspiration to build your programs, like client questions, research, or cooking at home.", "f": ["Feed post", "Stories"], "o": ["Behind the scenes"]}, {"id": "23-3", "w": 23, "t": "Share an app you can't live without. It could be a recipe organizer, a habit tracker, or a food-logging app that helps your audience too.", "f": ["Stories", "Feed post"], "o": ["Educate"]}, {"id": "23-4", "w": 23, "t": "Start the week with a list of 10 easy, actionable steps toward one small win, like \"10 ways to add more vegetables to your day.\"", "f": ["Feed post", "Carousel"], "o": ["Educate"]}, {"id": "23-5", "w": 23, "t": "Grab your audience's attention! Your post could be titled \"5 reasons it's hard to build a meal-prep habit.\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "23-6", "w": 23, "t": "To keep engagement up and learn more about your audience, run a series of THIS vs. THAT polls, like oatmeal vs. eggs or packed lunch vs. takeout.", "f": ["Stories"], "o": ["Engage"]}, {"id": "23-7", "w": 23, "t": "Entertain your audience with a Reel that captures how they feel at the end of the weekend, like Sunday-night grocery planning.", "f": ["Reels"], "o": ["Engage"]}, {"id": "24-1", "w": 24, "t": "Make a Stories video answering 3 frequently asked questions about your service, like pricing, what's included, and what to expect.", "f": ["Stories"], "o": ["Soft sell"]}, {"id": "24-2", "w": 24, "t": "Reciprocity trigger: Reshare every follower who interacts with your Stories, with a quick thank-you.", "f": ["Stories"], "o": ["Engage"]}, {"id": "24-3", "w": 24, "t": "Recommend the 5 best accounts in your field they should follow, like registered dietitians, trainers, or chefs, and say why.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "24-4", "w": 24, "t": "Your post title will be: BEGINNER'S GUIDE TO... building a habit, like reading labels or meal prepping.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "24-5", "w": 24, "t": "Make a carousel where each slide is one relevant tip for your audience, like one swap or habit per slide.", "f": ["Carousel"], "o": ["Educate"]}, {"id": "24-6", "w": 24, "t": "Recommend a restaurant everyone should know in your city or neighborhood, and what you'd order for a balanced meal.", "f": ["Feed post", "Stories"], "o": ["Educate", "Engage"]}, {"id": "24-7", "w": 24, "t": "Make a post with \"the truths nobody tells you about... (a topic like supplements or meal prep)\"", "f": ["Feed post"], "o": ["Educate"]}, {"id": "25-1", "w": 25, "t": "Make a video about the biggest mistake you see people make with food and nutrition, one you would NEVER make.", "f": ["Reels"], "o": ["Educate"]}, {"id": "25-2", "w": 25, "t": "Post a photo that makes followers want to try the same, like a colorful meal or a morning walk, with a reflective, positive caption.", "f": ["Feed post"], "o": ["Engage", "Behind the scenes"]}, {"id": "25-3", "w": 25, "t": "Explain 5 ways to use your product, like a meal planner for busy weeks, a grocery list, or a weekly check-in.", "f": ["Feed post", "Carousel"], "o": ["Soft sell"]}, {"id": "25-4", "w": 25, "t": "Talk in a Stories sequence about someone you admire and why they matter in your life. It can be a mentor, friend, family member, or public figure.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "25-5", "w": 25, "t": "Open a question box where the theme will be: ask me anything and I'll only answer YES OR NO.", "f": ["Stories"], "o": ["Engage"]}, {"id": "25-6", "w": 25, "t": "Talk about 3 things you plan to do before a certain age, like a trip, a skill to learn, or a goal for your practice.", "f": ["Feed post", "Stories"], "o": ["Behind the scenes"]}, {"id": "25-7", "w": 25, "t": "Post a styled photo of the 3 books every nutrition professional should read.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "26-1", "w": 26, "t": "Expert moment: make a Stories sequence explaining a new topic in the news that may interest your audience, with the source cited.", "f": ["Stories"], "o": ["Educate"]}, {"id": "26-2", "w": 26, "t": "Food photo day. Share a Stories showing a special dinner or snack and what makes it balanced.", "f": ["Stories"], "o": ["Behind the scenes", "Educate"]}, {"id": "26-3", "w": 26, "t": "Make a post on what anyone should do before getting into nutrition or coaching, like shadowing a pro or learning the credentials required in your state.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "26-4", "w": 26, "t": "Share your mission, or your business's, clearly with your audience.", "f": ["Feed post", "Stories"], "o": ["Soft sell", "Behind the scenes"]}, {"id": "26-5", "w": 26, "t": "Make a post with 4 nutrition trends to watch for the rest of the year, and what the evidence says.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "26-6", "w": 26, "t": "Mention a creator in your field you admire and follow, and share a powerful insight you learned from them.", "f": ["Feed post", "Stories"], "o": ["Educate"]}, {"id": "26-7", "w": 26, "t": "Poll day: run 10 yes-or-no polls in your Stories on nutrition topics, like \"Do you drink enough water?\" or \"Do you read labels?\"", "f": ["Stories"], "o": ["Engage"]}, {"id": "27-1", "w": 27, "t": "Introduce yourself and tell your story. Someone who found your profile today didn't hear what you shared a month ago. Share 5 facts about you or your practice.", "f": ["Feed post"], "o": ["Behind the scenes", "Soft sell"]}, {"id": "27-2", "w": 27, "t": "Run a 24-hour promotion on a program or service, with a special price or bonus for anyone who signs up in the next 24 hours, with clear terms.", "f": ["Stories", "Feed post"], "o": ["Soft sell"]}, {"id": "27-3", "w": 27, "t": "Go live with a follower to answer their nutrition questions in real time (general education, not individual medical advice).", "f": ["Live"], "o": ["Educate", "Engage"]}, {"id": "27-4", "w": 27, "t": "Share a little-known fact about your practice or your field, like how your first session works.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "27-5", "w": 27, "t": "If you sell a product, show 5 different ways to use it, like a meal planner for lunches, dinners, or weekly check-ins.", "f": ["Feed post", "Carousel"], "o": ["Soft sell"]}, {"id": "27-6", "w": 27, "t": "Open a question box for Sunday plans, like favorite walks, parks, or farmers markets. Share a few tips with yes-or-no polls to boost interaction and get to know your audience.", "f": ["Stories"], "o": ["Engage"]}, {"id": "27-7", "w": 27, "t": "Behind-the-scenes moment: Share how you build a meal plan or prepare for a client session, step by step.", "f": ["Stories"], "o": ["Behind the scenes", "Educate"]}, {"id": "28-1", "w": 28, "t": "#tbt Post a throwback to your graduation or an important certification, and what it taught you.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "28-2", "w": 28, "t": "Stories: Make a series of videos promoting your other channels, like your newsletter, YouTube, or podcast.", "f": ["Stories"], "o": ["Soft sell"]}, {"id": "28-3", "w": 28, "t": "STORIES: Share 3 fun facts about a new project, like a program or recipe collection you're building.", "f": ["Stories"], "o": ["Behind the scenes", "Soft sell"]}, {"id": "28-4", "w": 28, "t": "Video: Make a full tutorial on customizing or speeding up a process in your field, like the tools you use to build meal plans and how long each step takes...", "f": ["Reels"], "o": ["Educate"]}, {"id": "28-5", "w": 28, "t": "Make a post with a styled photo and a caption quoting a book (keep it short and credit the author).", "f": ["Feed post"], "o": ["Educate"]}, {"id": "28-6", "w": 28, "t": "Open a question box: ANYTHING BUT WORK.", "f": ["Stories"], "o": ["Engage", "Behind the scenes"]}, {"id": "28-7", "w": 28, "t": "STORYTELLING: document your day behind the scenes. Show how your work starts, your creative process, and the day's challenges, and invite your audience to join in with polls and questions.", "f": ["Stories"], "o": ["Behind the scenes"]}, {"id": "29-1", "w": 29, "t": "Open a question box with the theme: FREE Q&A. Answer your audience's questions throughout the day (general guidance, not individual medical advice).", "f": ["Stories"], "o": ["Engage"]}, {"id": "29-2", "w": 29, "t": "Make a feed post answering the most common question from yesterday's question box.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "29-3", "w": 29, "t": "Make a Stories sequence promoting an evening live Q&A. Don't forget to set a reminder.", "f": ["Stories"], "o": ["Engage", "Soft sell"]}, {"id": "29-4", "w": 29, "t": "Health moment: post from the gym or while exercising outdoors, encouraging your audience toward good habits, like a walk after dinner.", "f": ["Feed post"], "o": ["Behind the scenes", "Educate"]}, {"id": "29-5", "w": 29, "t": "Address a controversial topic in your field in your Stories, like a viral diet trend, and share your evidence-based take.", "f": ["Stories"], "o": ["Educate"]}, {"id": "29-6", "w": 29, "t": "Post a photo from a trip or at a restaurant, alone or with family.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "29-7", "w": 29, "t": "Make a feed post with 3 nutrition myths.", "f": ["Feed post"], "o": ["Educate"]}, {"id": "30-1", "w": 30, "t": "#TBTFAMILY Post a photo of a special family moment, maybe around a shared meal or tradition.", "f": ["Feed post"], "o": ["Behind the scenes"]}, {"id": "30-2", "w": 30, "t": "Make a Stories sequence on your growth and wins over the past few months, like new programs, workshops, or lessons learned.", "f": ["Stories"], "o": ["Behind the scenes", "Soft sell"]}, {"id": "30-3", "w": 30, "t": "If you sell products, host a LIVE SHOPPING EVENT to present your products and answer questions in real time.", "f": ["Live"], "o": ["Soft sell"]}, {"id": "30-4", "w": 30, "t": "Good news content: Start the day with a Stories sequence on good news or a positive update in your field, like a new study or a new program.", "f": ["Stories"], "o": ["Educate"]}, {"id": "30-5", "w": 30, "t": "Open a question box with the theme: no-fluff answers.", "f": ["Stories"], "o": ["Engage"]}, {"id": "30-6", "w"
